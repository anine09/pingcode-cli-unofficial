# Auto-release: every push to main checks if the version is new.
#
# Triggered on **any** push to `main` — merge, direct push, whatever. If the
# version in `package.json` has no matching `v{version}` tag yet, it builds,
# packages, tags and creates a GitHub Release. If the tag already exists, it
# skips. No manual version bump step and no manual `git tag` needed.
#
# Every step that touches something already on the remote is idempotent, because
# a re-run is the normal outcome of a failure, not an exception. Three states can
# be left behind by an aborted run, and none of them is an error:
#   - the tag exists (`git tag` fails with exit 128 without `-f`);
#   - the release exists (`gh release create` rejects the duplicate tag);
#   - the release exists **as a draft** — a draft is not associated with its tag,
#     so `gh release view` cannot find it, yet it still blocks `gh release create`.
# v1.8.2 failed on the third: the run's check ran 7 s before its draft was
# published, so the guard fell through and the run died on `git tag`.
#
# Flow:
#   1. Extract version from package.json
#   2. Skip if tag v{version} already exists (idempotent)
#   3. typecheck → test → build → smoke
#   4. Package 6 platform zips (scripts/package-release.ts)
#   5. Create git tag v{version}
#   6. Create GitHub Release with 6 zips + npm tarball
#
# Rollback:
#   gh release delete v{version}
#   git push origin :refs/tags/v{version}
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: build, package and release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --- Extract version and check idempotency ---
      - name: extract version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "current version: v${version}"

      - name: skip if already released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"

          if ! git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} does not exist yet — releasing"
            echo "skip=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "tag ${tag} already exists"

          # `gh release view` resolves *published* releases only, so a release
          # still in draft is invisible to it — and a draft is exactly what made
          # `gh release create` fail with "a release with the same tag name
          # already exists" at v1.8.0. Match tag_name across every release,
          # drafts included, which is the state the create step has to live with.
          if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
               --jq '.[].tag_name' 2>/dev/null | grep -qx "${tag}"; then
            echo "release ${tag} already exists (published or draft) — nothing to do"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "tag ${tag} exists but no release does — re-running the release"
          echo "skip=false" >> "$GITHUB_ENV"

      # --- Quality gates ---
      - name: install
        if: env.skip != 'true'
        run: npm ci

      - name: typecheck
        if: env.skip != 'true'
        run: npm run typecheck

      - name: test
        if: env.skip != 'true'
        run: npm test

      - name: build
        if: env.skip != 'true'
        run: npm run build

      - name: smoke the built binary
        if: env.skip != 'true'
        run: |
          node dist/bin/pingcode.js --version
          node dist/bin/pingcode.js --help

      # --- Package 6 platform zips ---
      - name: install zip
        if: env.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: package release zips
        if: env.skip != 'true'
        run: npm run package:release

      # --- Pack npm tarball ---
      - name: pack the npm tarball
        if: env.skip != 'true'
        id: pack
        run: |
          tarball="$(npm pack --silent --ignore-scripts 2>/dev/null | tail -1)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          ls -l "${tarball}"

      # --- Smoke the packed npm tarball ---
      # The binary smoked above runs inside the checkout, where node_modules/
      # exists. This tarball is what `pingcode self-update` actually downloads
      # and it is extracted by `npm pack` without node_modules/, so it is
      # executed from an empty temp dir before it is attached to a release.
      - name: smoke the packed npm tarball
        if: env.skip != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          dir="$(mktemp -d)"
          tar -xzf "${TARBALL}" -C "${dir}"
          node "${dir}/package/dist/bin/pingcode.js" --version
          node "${dir}/package/dist/bin/pingcode.js" --help

      # --- Create tag and release ---
      - name: create git tag
        if: env.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Force, so a tag left behind by an aborted run is a no-op instead of
          # `fatal: tag 'v1.8.2' already exists` and exit 128 — that is what
          # failed run 34310574571. Safe: the guard above has already proven no
          # release exists for this version, and a version number maps to exactly
          # one commit, the one that declares it.
          git tag -f "v${VERSION}"
          git push --force origin "v${VERSION}"
          echo "created tag v${VERSION}"

      - name: create GitHub Release
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          assets=(release/pingcode-cli-v*.zip)
          echo "uploading ${#assets[@]} platform zip(s) + npm tarball"
          for a in "${assets[@]}"; do
            echo "  ${a}"
          done

          # A release can appear between the guard above and this step — that is
          # the very race that cost v1.8.2 — so the check is repeated here rather
          # than trusted from a step output. Reuse the release and upload onto
          # it, so a re-run completes the job instead of dying on a duplicate tag.
          if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
               --jq '.[].tag_name' 2>/dev/null | grep -qx "v${VERSION}"; then
            echo "release v${VERSION} already exists — attaching assets to it"
            gh release upload "v${VERSION}" "${assets[@]}" "$TARBALL" --clobber
            exit 0
          fi

          gh release create "v${VERSION}" \
            "${assets[@]}" \
            "$TARBALL" \
            --title "v${VERSION}" \
            --generate-notes
