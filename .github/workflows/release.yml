# Tag-driven release (prd 08-01-ci-cd-pipeline: D7/D8).
#
# Cut a release by tagging a commit that is already green on `main`:
#
#   git tag -a vX.Y.Z -m 'vX.Y.Z' && git push origin vX.Y.Z
#
# The tag must equal `package.json`'s version; that is asserted before anything
# else happens, so a mistyped tag costs one failed step instead of a bad
# release. Nothing is pushed to the npm registry — the package name is not
# claimed yet, and registry publishing stays an explicit non-goal.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: verify the tag and publish the GitHub release
    runs-on: ubuntu-latest
    permissions:
      # The only elevated grant in the repository, and only for `gh release create`.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor from `engines`: if the release artifact builds and runs
          # here, it runs everywhere the package claims to support.
          node-version: '20'
          cache: npm

      # First, and before install/build, so a tag/version mismatch fails fast.
      - name: assert the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "tag: ${TAG}"
          echo "package.json: ${version}"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: smoke the built binary
        run: |
          node dist/bin/pingcode.js --version
          node dist/bin/pingcode.js --help

      # `files` in package.json decides the contents: dist, skills, README.
      - name: pack the tarball
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          ls -l "${tarball}"

      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release create "$TAG" "$TARBALL" --title "$TAG" --generate-notes
