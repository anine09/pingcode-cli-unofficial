name: Publish to npm

on:
  push:
    branches: [main]
    paths: ['package.json']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for creating git tags + GitHub Release
      id-token: write   # for npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for tagging

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Tag and release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # `pingcode self-update` downloads the tarball published below, and npm
      # strips node_modules/ from it. The binary built above ran inside the
      # checkout, where those dependencies exist, so pack and smoke the artifact
      # exactly as a client receives it before it can reach the registry.
      - name: pack the npm tarball
        id: pack
        run: |
          tarball="$(npm pack --silent --ignore-scripts 2>/dev/null | tail -1)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          ls -l "${tarball}"

      - name: smoke the packed npm tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          dir="$(mktemp -d)"
          tar -xzf "${TARBALL}" -C "${dir}"
          node "${dir}/package/dist/bin/pingcode.js" --version
          node "${dir}/package/dist/bin/pingcode.js" --help

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
